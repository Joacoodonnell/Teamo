<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi San Valentín ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            /* Fondo romántico */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
        }

        .card {
            background-color: rgba(255, 250, 240, 0.95); /* Crema muy claro */
            width: 90%;
            max-width: 400px; /* Ancho tipo celular */
            height: 650px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(233, 30, 99, 0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* --- Pantalla de Inicio --- */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background-color: inherit;
            border-radius: inherit;
            transition: opacity 0.8s ease-out;
        }

        .start-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            font-size: 1.2rem;
            color: #c2185b;
            font-weight: 600;
            background: rgba(255,255,255,0.5);
            padding: 20px 40px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .heart-icon {
            font-size: 4rem;
            color: #e91e63;
            margin-bottom: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); text-shadow: 0 0 15px #e91e63; }
            100% { transform: scale(1); }
        }

        /* --- Contenido Principal --- */
        #main-content {
            position: relative;
            width: 100%;
            height: 100%;
            opacity: 0; /* Oculto al inicio */
            pointer-events: none;
            transition: opacity 1s;
        }

        .text-container {
            position: absolute;
            top: 50px;
            left: 30px;
            width: 85%;
            z-index: 10;
            color: #000000;
            opacity: 0; /* Aparece después */
            transition: opacity 2s ease-in-out;
        }

        h2 {
            font-size: 1.1rem;
            color: #c2185b;
            margin-bottom: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 15px;
            color: #000000;
        }

        .highlight {
            color: #e91e63;
            font-weight: 600;
        }

        canvas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
        }

        .timer-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 10;
            opacity: 0; /* Aparece después */
            transition: opacity 2s ease-in-out;
            padding-top: 15px;
            border-top: 1px solid rgba(233, 30, 99, 0.3);
            width: 80%;
        }

        .timer-label {
            font-size: 0.9rem;
            color: #000000;
            margin-bottom: 5px;
        }

        #timer {
            font-size: 1.1rem;
            font-weight: 600;
            color: #000000;
        }
        
        #timer span {
            color: #e91e63;
        }

    </style>
</head>
<body>

    <div class="card">
        <div id="start-screen">
            <div class="start-button" onclick="startAnimation()">
                <span class="heart-icon">❤️</span>
                <span>¡Tengo una sorpresa!</span>
                <span style="font-size: 0.8rem; font-weight: 400; margin-top: 5px;">(Toca aquí)</span>
            </div>
        </div>

        <div id="main-content">
            <div class="text-container">
                <h2>Para el amor de mi vida:</h2>
                <p>Aunque hoy estes lejos, quiero que sepas que...</p>
                <p class="highlight">Si pudiera elegir un lugar seguro en el mundo, siempre sería a tu lado.</p>
                <p>Cuanto más tiempo estoy con vos, más te amo.</p>
            </div>

            <canvas id="flowerCanvas"></canvas>

            <div class="timer-container">
                <div class="timer-label">Juntos desde...</div>
                <div id="timer">Calculando...</div>
            </div>
        </div>
    </div>

    <script>
        let animationStarted = false;
        const startScreen = document.getElementById('start-screen');
        const mainContent = document.getElementById('main-content');
        const textContainer = document.querySelector('.text-container');
        const timerContainer = document.querySelector('.timer-container');
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let gameState = 'start'; // start, growing, blooming, finished
        let flowers = [];
        let fallingHearts = [];
        let time = 0;

        // --- Lógica del Timer ---
        const startDate = new Date('2025-08-24T22:00:00');

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;
            if (diff < 0) { document.getElementById('timer').innerHTML = "<span>Pronto...</span>"; return; }
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById('timer').innerHTML = `${days} días, ${hours} hs, ${minutes} min`;
        }
        setInterval(updateTimer, 1000);

        // --- Función de Inicio ---
        function startAnimation() {
            if (animationStarted) return;
            animationStarted = true;
            startScreen.style.opacity = '0';
            setTimeout(() => {
                startScreen.style.display = 'none';
                mainContent.style.opacity = '1';
                mainContent.style.pointerEvents = 'auto';
                resize();
                initFlowers();
                gameState = 'growing';
                animate();
            }, 800);
        }

        function resize() {
            const rect = canvas.getBoundingClientRect();
            width = canvas.width = rect.width;
            height = canvas.height = rect.height;
        }
        window.addEventListener('resize', resize);

        // --- CLASE FLOR ---
        class Flower {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.targetHeight = height * (0.15 + Math.random() * 0.35); // Altura variada
                this.currentHeight = 0;
                this.bloomScale = 0;
                this.growSpeed = (this.targetHeight / 100) * (0.8 + Math.random() * 0.4);
                // Colores rosados, rojos, púrpuras
                this.color = `hsl(${330 + Math.random() * 40}, ${80 + Math.random()*20}%, ${50 + Math.random()*30}%)`; 
                this.swayOffset = Math.random() * Math.PI * 2;
                this.swaySpeed = 0.001 + Math.random() * 0.002;
                this.scale = 0.5 + Math.random() * 0.5;
            }

            update(time, state) {
                if (state === 'growing') {
                    if (this.currentHeight < this.targetHeight) {
                        this.currentHeight += this.growSpeed;
                    }
                } else if (state === 'blooming' || state === 'finished') {
                    if (this.bloomScale < 1) {
                        this.bloomScale += 0.02;
                    }
                }
            }

            draw(ctx, time) {
                const sway = Math.sin(time * this.swaySpeed + this.swayOffset) * 10 * (this.currentHeight / this.targetHeight);
                
                ctx.save();
                ctx.translate(this.x, this.y);

                // Tallo
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(sway, -this.currentHeight / 2, sway * 1.2, -this.currentHeight);
                ctx.strokeStyle = '#2e7d32'; // Verde oscuro
                ctx.lineWidth = 3 * this.scale;
                ctx.lineCap = 'round';
                ctx.stroke();

                // Flor (Pétalos)
                if (this.bloomScale > 0) {
                    ctx.translate(sway * 1.2, -this.currentHeight);
                    const bs = this.bloomScale * this.scale;
                    
                    ctx.fillStyle = this.color;
                    for (let i = 0; i < 6; i++) {
                        ctx.rotate(Math.PI / 3);
                        ctx.beginPath();
                        ctx.ellipse(0, -10 * bs, 5 * bs, 12 * bs, 0, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    // Centro
                    ctx.beginPath();
                    ctx.fillStyle = '#ffd54f'; // Amarillo centro
                    ctx.arc(0, 0, 4 * bs, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        // --- Corazones que caen ---
        class FallingHeart {
            constructor() {
                this.x = Math.random() * width;
                this.y = -20;
                this.size = 5 + Math.random() * 10;
                this.speed = 1 + Math.random() * 2;
                this.color = `rgba(233, 30, 99, ${0.3 + Math.random() * 0.5})`;
            }
            update() { this.y += this.speed; }
            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                const x=this.x, y=this.y, s=this.size;
                ctx.moveTo(x, y);
                ctx.bezierCurveTo(x - s/2, y - s/2, x - s, y + s/3, x, y + s);
                ctx.bezierCurveTo(x + s, y + s/3, x + s/2, y - s/2, x, y);
                ctx.fill();
            }
        }

        function initFlowers() {
            // Generar flores en la esquina inferior derecha
            const numFlowers = 50;
            for (let i = 0; i < numFlowers; i++) {
                // Distribución aleatoria concentrada en la derecha
                const x = width * (0.3 + Math.random() * 0.7); 
                const y = height + Math.random() * 20; // Empiezan un poco más abajo del borde
                flowers.push(new Flower(x, y));
            }
            // Ordenar por posición Y para que las de atrás se dibujen primero
            flowers.sort((a, b) => a.y - b.y);
        }

        function animate() {
            if (!animationStarted) return;
            ctx.clearRect(0, 0, width, height);
            time += 16;

            // Control de estados
            if (gameState === 'growing') {
                const fullyGrown = flowers.filter(f => f.currentHeight >= f.targetHeight).length;
                if (fullyGrown > flowers.length * 0.9) { // Si el 90% creció
                    gameState = 'blooming';
                }
            } else if (gameState === 'blooming') {
                 const fullyBloomed = flowers.filter(f => f.bloomScale >= 1).length;
                 if (fullyBloomed > flowers.length * 0.95) {
                     gameState = 'finished';
                     // Mostrar textos
                     textContainer.style.opacity = '1';
                     timerContainer.style.opacity = '1';
                     updateTimer();
                 }
            }

            // Dibujar Flores
            flowers.forEach(flower => {
                flower.update(time, gameState);
                flower.draw(ctx, time);
            });

            // Corazones cayendo al final
            if (gameState === 'finished' && Math.random() > 0.92) {
                fallingHearts.push(new FallingHeart());
            }
            fallingHearts.forEach((fh, i) => {
                fh.update();
                fh.draw(ctx);
                if(fh.y > height) fallingHearts.splice(i, 1);
            });

            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
